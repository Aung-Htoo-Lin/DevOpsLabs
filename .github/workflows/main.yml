name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup network & MongoDB
        run: |
          docker network create --driver bridge se-methods
          docker run -d --name mongo-dbserver --network se-methods mongo:latest
          # Wait for MongoDB to become healthy before proceeding
          echo "Waiting for MongoDB to start..."
          until docker exec mongo-dbserver mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
            sleep 2
          done
          echo "MongoDB is ready!"

      - name: Build with Maven
        run: mvn package

      - name: Build Docker image
        run: docker build -t se_methods .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer se_methods

      - name: View logs
        run: docker logs devopscontainer